name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run checks and tests
        run: |
          npm run check
          npm run test:unit
          # The Durable Object suite runs in real workerd and is the only thing
          # covering room capacity, password enforcement and hibernation. Leaving it
          # out of CI meant a regression in worker/room.ts could ship to production
          # with a fully green pipeline.
          npm run test:worker

      - name: Build static assets
        run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
