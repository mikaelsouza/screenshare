name: Deploy to Cloudflare Workers

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main

# Least privilege for the built-in token: this job reads the repository and checks
# workflow run statuses. The Cloudflare deploy uses its own API token, not GITHUB_TOKEN.
permissions:
  contents: read
  actions: read

# Serialize production deployments so two pushes to main never race, and never cancel
# an in-flight Cloudflare deployment halfway through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    # No `environment:` here. Environments (scoped secrets, branch restrictions) need
    # GitHub Pro for a private repository; on the Free plan they cannot be configured,
    # so referencing one would buy nothing and risk the deploy job itself.
    steps:
      # Every action is pinned to a full commit SHA, not a tag. A tag can be moved to
      # different code after the fact (the tj-actions/changed-files compromise did
      # exactly that), and whatever runs here holds the Cloudflare deploy token.
      # Dependabot keeps these SHAs current; the version is in the trailing comment.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Verify CI and CodeQL passed for current main tip
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          CURRENT_MAIN_SHA="$(git rev-parse HEAD)"
          echo "Verifying CI and CodeQL status for main tip: $CURRENT_MAIN_SHA"

          for WORKFLOW_FILE in "ci.yml" "codeql.yml"; do
            ATTEMPTS=0
            while true; do
              RUN_JSON="$(gh api "repos/$REPO/actions/workflows/$WORKFLOW_FILE/runs?head_sha=$CURRENT_MAIN_SHA&per_page=1")"
              STATUS="$(printf '%s' "$RUN_JSON" | jq -r '.workflow_runs[0].status // "missing"')"
              CONCLUSION="$(printf '%s' "$RUN_JSON" | jq -r '.workflow_runs[0].conclusion // "null"')"

              if [ "$STATUS" = "completed" ]; then
                if [ "$CONCLUSION" = "success" ]; then
                  echo "$WORKFLOW_FILE succeeded for $CURRENT_MAIN_SHA."
                  break
                fi
                echo "::error::$WORKFLOW_FILE completed with conclusion '$CONCLUSION' for $CURRENT_MAIN_SHA."
                exit 1
              fi

              ATTEMPTS=$((ATTEMPTS + 1))
              if [ "$ATTEMPTS" -ge 60 ]; then
                echo "::error::Timed out waiting for $WORKFLOW_FILE on $CURRENT_MAIN_SHA (last status: $STATUS)."
                exit 1
              fi
              sleep 10
            done
          done

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build static assets
        run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
