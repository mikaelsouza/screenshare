name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

# Least privilege for the built-in token: this job only reads the repository. The
# Cloudflare deploy uses its own API token, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # No `environment:` here. Environments (scoped secrets, branch restrictions) need
    # GitHub Pro for a private repository; on the Free plan they cannot be configured,
    # so referencing one would buy nothing and risk the deploy job itself.
    steps:
      # Every action is pinned to a full commit SHA, not a tag. A tag can be moved to
      # different code after the fact (the tj-actions/changed-files compromise did
      # exactly that), and whatever runs here holds the Cloudflare deploy token.
      # Dependabot keeps these SHAs current; the version is in the trailing comment.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run checks and tests
        run: |
          npm run check
          npm run test:unit
          # The Durable Object suite runs in real workerd and is the only thing
          # covering room capacity, password enforcement and hibernation. Leaving it
          # out of CI meant a regression in worker/room.ts could ship to production
          # with a fully green pipeline.
          npm run test:worker

      - name: Build static assets
        run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
