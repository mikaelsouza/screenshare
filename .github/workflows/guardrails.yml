name: Guardrails

on:
  push:
    branches:
      - main
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: guardrails-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  guardrails-diff:
    name: Guardrail & Spec Diff Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always checks out the trusted base branch (default for pull_request_target).
      # PR file metadata is queried read-only via the GitHub API; untrusted PR commits are never fetched or executed.
      - name: Checkout trusted base repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check protected guardrail modifications
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
          HEAD_SHA: ${{ github.event_name == 'push' && github.event.after || '' }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request_target" ]; then
            FILES_JSON="$(mktemp "${RUNNER_TEMP:-/tmp}/pr-files.XXXXXX.json")"
            trap 'rm -f "$FILES_JSON"' EXIT
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" > "$FILES_JSON"
            CHANGED_FILES_PATH="$FILES_JSON" node scripts/check-guardrails-diff.ts
          else
            node scripts/check-guardrails-diff.ts
          fi
