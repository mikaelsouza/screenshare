name: Release Electron Desktop App

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: "Publish a new patch release even when no Electron-relevant files changed"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-electron-production
  cancel-in-progress: false

jobs:
  prepare:
    name: Plan Electron Release
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      version: ${{ steps.plan.outputs.version }}
      target_sha: ${{ steps.plan.outputs.target_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Determine release version, scope, and workflow gates
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          TARGET_SHA="$(git rev-parse HEAD)"

          if [ "$EVENT_NAME" = "workflow_run" ] && [ -n "${WORKFLOW_HEAD_SHA:-}" ] && [ "$WORKFLOW_HEAD_SHA" != "$TARGET_SHA" ]; then
            echo "Commit ${WORKFLOW_HEAD_SHA} is superseded by current main tip ${TARGET_SHA}; skipping release."
            {
              echo "should_release=false"
              echo "version="
              echo "target_sha=${TARGET_SHA}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ALL_TAGS="$({
            git tag -l 'v*'
            gh api --paginate "repos/$REPO/releases?per_page=100" --jq '.[].tag_name' 2>/dev/null || true
          } | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -uV || true)"

          LATEST_TAG=""
          if [ -n "$ALL_TAGS" ]; then
            LATEST_TAG="$(printf '%s\n' "$ALL_TAGS" | tail -n 1)"
          fi

          FORCE_RELEASE="false"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "${INPUT_FORCE:-false}" = "true" ]; then
            FORCE_RELEASE="true"
          fi

          SHOULD_RELEASE="false"
          if [ "$FORCE_RELEASE" = "true" ] || [ -z "$LATEST_TAG" ]; then
            SHOULD_RELEASE="true"
          elif ! git merge-base --is-ancestor "$LATEST_TAG" HEAD 2>/dev/null; then
            SHOULD_RELEASE="true"
          else
            CHANGED_FILES="$(git diff --name-only "${LATEST_TAG}..HEAD")"
            if printf '%s\n' "$CHANGED_FILES" | grep -qE '^(electron/|electron-builder\.json$|tsconfig\.electron\.json$|assets/icon\.(ico|svg)$|\.github/workflows/release-electron\.yml$)'; then
              SHOULD_RELEASE="true"
            elif printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(package\.json|package-lock\.json)$'; then
              if LATEST_TAG="$LATEST_TAG" node -e '
                const { execFileSync } = require("node:child_process");
                const fs = require("node:fs");

                const readAtTag = (tag, filePath) => {
                  try {
                    return JSON.parse(execFileSync("git", ["show", `${tag}:${filePath}`], { encoding: "utf8" }));
                  } catch {
                    return null;
                  }
                };
                const readCurrent = (filePath) => {
                  try {
                    return JSON.parse(fs.readFileSync(filePath, "utf8"));
                  } catch {
                    return null;
                  }
                };
                const pickPkg = (pkg) => ({
                  version: pkg?.version ?? null,
                  main: pkg?.main ?? null,
                  dependencies: pkg?.dependencies ?? {},
                  overrides: pkg?.overrides ?? {},
                  electron: pkg?.devDependencies?.electron ?? null,
                  electronBuilder: pkg?.devDependencies?.["electron-builder"] ?? null,
                });
                const pickLock = (lock) => {
                  if (!lock?.packages) return null;
                  const entries = [];
                  for (const [name, info] of Object.entries(lock.packages)) {
                    if (name === "") continue;
                    const isPackagedRuntime = info && info.dev !== true;
                    const isElectronTooling =
                      name === "node_modules/electron" ||
                      name === "node_modules/electron-builder";
                    if (isPackagedRuntime || isElectronTooling) {
                      entries.push([name, info?.version ?? null, info?.resolved ?? null, info?.integrity ?? null]);
                    }
                  }
                  entries.sort((a, b) => a[0].localeCompare(b[0]));
                  return entries;
                };

                const tag = process.env.LATEST_TAG;
                const pkgChanged =
                  JSON.stringify(pickPkg(readAtTag(tag, "package.json"))) !==
                  JSON.stringify(pickPkg(readCurrent("package.json")));
                const lockChanged =
                  JSON.stringify(pickLock(readAtTag(tag, "package-lock.json"))) !==
                  JSON.stringify(pickLock(readCurrent("package-lock.json")));
                process.exit(pkgChanged || lockChanged ? 0 : 1);
              '; then
                SHOULD_RELEASE="true"
              fi
            fi
          fi

          if [ "$SHOULD_RELEASE" != "true" ]; then
            echo "No Electron-affecting changes since ${LATEST_TAG}; skipping release."
            {
              echo "should_release=false"
              echo "version="
              echo "target_sha=${TARGET_SHA}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE_VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$BASE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::package.json version '$BASE_VERSION' must match MAJOR.MINOR.PATCH"
            exit 1
          fi
          BASE_MAJOR="${BASH_REMATCH[1]}"
          BASE_MINOR="${BASH_REMATCH[2]}"
          BASE_PATCH="${BASH_REMATCH[3]}"

          MATCHING_TAGS="$(printf '%s\n' "$ALL_TAGS" | grep -E "^v${BASE_MAJOR}\.${BASE_MINOR}\.[0-9]+$" || true)"
          if [ -z "$MATCHING_TAGS" ]; then
            NEXT_VERSION="${BASE_MAJOR}.${BASE_MINOR}.${BASE_PATCH}"
          else
            MAX_PATCH="$(printf '%s\n' "$MATCHING_TAGS" | sed -E 's/^v[0-9]+\.[0-9]+\.([0-9]+)$/\1/' | sort -n | tail -n 1)"
            CANDIDATE=$((MAX_PATCH + 1))
            if [ "$BASE_PATCH" -gt "$CANDIDATE" ]; then
              NEXT_PATCH="$BASE_PATCH"
            else
              NEXT_PATCH="$CANDIDATE"
            fi
            NEXT_VERSION="${BASE_MAJOR}.${BASE_MINOR}.${NEXT_PATCH}"
          fi

          if [ -n "$LATEST_TAG" ]; then
            if ! NEXT_VERSION="$NEXT_VERSION" LATEST_TAG="$LATEST_TAG" node -e '
              const parse = (v) => v.replace(/^v/, "").split(".").map((n) => Number.parseInt(n, 10));
              const [na, nb, nc] = parse(process.env.NEXT_VERSION);
              const [la, lb, lc] = parse(process.env.LATEST_TAG);
              const gt = na > la || (na === la && (nb > lb || (nb === lb && nc > lc)));
              process.exit(gt ? 0 : 1);
            '; then
              echo "::error::Computed version v${NEXT_VERSION} would regress below latest release ${LATEST_TAG}."
              exit 1
            fi
          fi

          echo "Verifying CI and CodeQL status for target commit: $TARGET_SHA"
          for WORKFLOW_FILE in "ci.yml" "codeql.yml"; do
            ATTEMPTS=0
            while true; do
              RUN_JSON="$(gh api "repos/$REPO/actions/workflows/$WORKFLOW_FILE/runs?head_sha=$TARGET_SHA&branch=main&event=push&per_page=1")"
              STATUS="$(printf '%s' "$RUN_JSON" | jq -r '.workflow_runs[0].status // "missing"')"
              CONCLUSION="$(printf '%s' "$RUN_JSON" | jq -r '.workflow_runs[0].conclusion // "null"')"

              if [ "$STATUS" = "completed" ]; then
                if [ "$CONCLUSION" = "success" ]; then
                  echo "$WORKFLOW_FILE succeeded for $TARGET_SHA."
                  break
                fi
                if [ "$CONCLUSION" = "cancelled" ] || [ "$CONCLUSION" = "skipped" ]; then
                  echo "$WORKFLOW_FILE completed with conclusion '$CONCLUSION' for $TARGET_SHA; skipping release."
                  {
                    echo "should_release=false"
                    echo "version="
                    echo "target_sha=${TARGET_SHA}"
                  } >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                echo "::error::$WORKFLOW_FILE completed with conclusion '$CONCLUSION' for $TARGET_SHA."
                exit 1
              fi

              ATTEMPTS=$((ATTEMPTS + 1))
              if [ "$ATTEMPTS" -ge 60 ]; then
                echo "::error::Timed out waiting for $WORKFLOW_FILE on $TARGET_SHA (last status: $STATUS)."
                exit 1
              fi
              sleep 10
            done
          done

          echo "Planning Electron release v${NEXT_VERSION} for commit ${TARGET_SHA} (previous tag: ${LATEST_TAG:-none})."
          {
            echo "should_release=true"
            echo "version=${NEXT_VERSION}"
            echo "target_sha=${TARGET_SHA}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build & Smoke-Test Windows Installer
    needs: prepare
    if: ${{ needs.prepare.outputs.should_release == 'true' }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Verify checked-out commit matches planned target SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.target_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::main advanced from ${EXPECTED_SHA} to ${ACTUAL_SHA} before build checkout; deferring to newer CI run."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci --legacy-peer-deps

      - name: Stamp release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: npm pkg set "version=${RELEASE_VERSION}"

      - name: Build Windows installer
        shell: bash
        run: npm run electron:build

      - name: Smoke-test packaged binary and verify artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          test -f "release/win-unpacked/resources/app-update.yml"
          test -f "release/Screenshare-Setup-${RELEASE_VERSION}.exe"
          test -f "release/Screenshare-Setup-${RELEASE_VERSION}.exe.blockmap"
          test -f "release/latest.yml"
          npm run electron:smoke:packaged
          (
            cd release
            sha256sum -b \
              "Screenshare-Setup-${RELEASE_VERSION}.exe" \
              "Screenshare-Setup-${RELEASE_VERSION}.exe.blockmap" \
              "latest.yml" > SHA256SUMS.txt
          )

      - name: Upload Windows release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-assets
          path: |
            release/Screenshare-Setup-${{ needs.prepare.outputs.version }}.exe
            release/Screenshare-Setup-${{ needs.prepare.outputs.version }}.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release-assets
          path: dist-release

      - name: Verify checksums and publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid RELEASE_VERSION: '$RELEASE_VERSION'"
            exit 1
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid TARGET_SHA: '$TARGET_SHA'"
            exit 1
          fi

          TAG="v${RELEASE_VERSION}"
          ASSETS=(
            "dist-release/Screenshare-Setup-${RELEASE_VERSION}.exe"
            "dist-release/Screenshare-Setup-${RELEASE_VERSION}.exe.blockmap"
            "dist-release/latest.yml"
            "dist-release/SHA256SUMS.txt"
          )
          for ASSET in "${ASSETS[@]}"; do
            test -f "$ASSET"
          done

          (
            cd dist-release
            sha256sum -c SHA256SUMS.txt
          )

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          refresh_repo_metadata() {
            gh api --paginate "repos/$REPO/releases?per_page=100" \
              | jq -s 'add // [] | map({tag_name, draft, prerelease, target_commitish, assets: ((.assets // []) | map({name, state, size, digest}))})' \
              > "$TMP_DIR/releases.json"
            gh api --paginate "repos/$REPO/git/matching-refs/tags/v" \
              | jq -s 'add // [] | map(.ref)' \
              > "$TMP_DIR/tags.json"
          }

          find_newer_published_tag() {
            refresh_repo_metadata
            RELEASE_VERSION="$RELEASE_VERSION" TMP_DIR="$TMP_DIR" node -e '
              const fs = require("node:fs");
              const path = require("node:path");
              const parse = (v) => {
                const m = /^v?([0-9]+)\.([0-9]+)\.([0-9]+)$/.exec(v || "");
                return m ? [Number(m[1]), Number(m[2]), Number(m[3])] : null;
              };
              const cmp = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
              const target = parse(process.env.RELEASE_VERSION);
              const releases = JSON.parse(fs.readFileSync(path.join(process.env.TMP_DIR, "releases.json"), "utf8"));
              const tags = JSON.parse(fs.readFileSync(path.join(process.env.TMP_DIR, "tags.json"), "utf8"));
              const candidates = new Set();
              for (const r of releases) {
                if (r && !r.draft && !r.prerelease && typeof r.tag_name === "string") {
                  candidates.add(r.tag_name);
                }
              }
              for (const ref of tags) {
                if (typeof ref === "string" && ref.startsWith("refs/tags/")) {
                  candidates.add(ref.slice("refs/tags/".length));
                }
              }
              let highest = null;
              let highestParsed = target;
              for (const tag of candidates) {
                const parsed = parse(tag);
                if (parsed && cmp(parsed, highestParsed) > 0) {
                  highest = tag;
                  highestParsed = parsed;
                }
              }
              if (highest) process.stdout.write(highest);
            '
          }

          NEWER_TAG="$(find_newer_published_tag)"
          if [ -n "$NEWER_TAG" ]; then
            echo "::warning::Skipping stale release ${TAG}: newer release ${NEWER_TAG} is already published."
            exit 0
          fi

          TAG_EXISTS="$(jq -r --arg ref "refs/tags/${TAG}" 'any(.[]; . == $ref)' "$TMP_DIR/tags.json")"
          if [ "$TAG_EXISTS" = "true" ]; then
            EXISTING_TAG_SHA="$(gh api "repos/$REPO/commits/refs/tags/$TAG" --jq '.sha')"
            if [ "$EXISTING_TAG_SHA" != "$TARGET_SHA" ]; then
              echo "::error::Tag ${TAG} already points to ${EXISTING_TAG_SHA}, expected ${TARGET_SHA}; refusing to modify release."
              exit 1
            fi
          fi

          INSPECTION="$(
            TAG="$TAG" \
            TARGET_SHA="$TARGET_SHA" \
            RELEASE_VERSION="$RELEASE_VERSION" \
            TMP_DIR="$TMP_DIR" \
            node -e '
              const crypto = require("node:crypto");
              const fs = require("node:fs");
              const path = require("node:path");

              const tag = process.env.TAG;
              const targetSha = process.env.TARGET_SHA;
              const version = process.env.RELEASE_VERSION;
              const tmpDir = process.env.TMP_DIR;
              const expectedFiles = [
                `dist-release/Screenshare-Setup-${version}.exe`,
                `dist-release/Screenshare-Setup-${version}.exe.blockmap`,
                "dist-release/latest.yml",
                "dist-release/SHA256SUMS.txt",
              ];
              const localByName = new Map();
              for (const filePath of expectedFiles) {
                const buf = fs.readFileSync(filePath);
                const sha256 = crypto.createHash("sha256").update(buf).digest("hex");
                localByName.set(path.basename(filePath), { filePath, size: buf.length, sha256 });
              }

              const allReleases = JSON.parse(fs.readFileSync(path.join(tmpDir, "releases.json"), "utf8"));
              const releases = allReleases.filter((r) => r && r.tag_name === tag);
              if (releases.length === 0) {
                process.stdout.write(JSON.stringify({ state: "missing", missingFiles: expectedFiles }));
                process.exit(0);
              }
              if (releases.length > 1) {
                console.error(`::error::Multiple releases found for ${tag}; clean up duplicate drafts before retrying.`);
                process.exit(1);
              }

              const rel = releases[0];
              if (rel.prerelease) {
                console.error(`::error::Existing release ${tag} is marked as prerelease; refusing to modify.`);
                process.exit(1);
              }
              if (rel.draft) {
                if (rel.target_commitish !== targetSha) {
                  console.error(`::error::Draft release ${tag} targets ${rel.target_commitish}, expected ${targetSha}.`);
                  process.exit(1);
                }
                process.stdout.write(JSON.stringify({ state: "draft", missingFiles: expectedFiles }));
                process.exit(0);
              }

              const remoteAssets = Array.isArray(rel.assets) ? rel.assets : [];
              const seenNames = new Set();
              for (const asset of remoteAssets) {
                const expected = localByName.get(asset.name);
                if (!expected) {
                  console.error(`::error::Published release ${tag} contains unexpected asset ${asset.name}; refusing to modify immutable release.`);
                  process.exit(1);
                }
                if (asset.state !== "uploaded") {
                  console.error(`::error::Published release ${tag} contains incomplete asset ${asset.name} (state: ${asset.state}).`);
                  process.exit(1);
                }
                if (asset.size !== expected.size) {
                  console.error(`::error::Published release ${tag} asset ${asset.name} size (${asset.size}) differs from built artifact (${expected.size}).`);
                  process.exit(1);
                }
                if (typeof asset.digest === "string" && asset.digest !== `sha256:${expected.sha256}`) {
                  console.error(`::error::Published release ${tag} asset ${asset.name} digest (${asset.digest}) differs from built artifact (sha256:${expected.sha256}).`);
                  process.exit(1);
                }
                seenNames.add(asset.name);
              }

              const missingFiles = [];
              for (const [name, info] of localByName.entries()) {
                if (!seenNames.has(name)) {
                  missingFiles.push(info.filePath);
                }
              }
              process.stdout.write(JSON.stringify({ state: "published", missingFiles }));
            '
          )"

          RELEASE_STATE="$(printf '%s' "$INSPECTION" | jq -r '.state')"
          mapfile -t MISSING_ASSETS < <(printf '%s' "$INSPECTION" | jq -r '.missingFiles[]')

          if [ "$RELEASE_STATE" = "published" ]; then
            if [ "$TAG_EXISTS" != "true" ]; then
              echo "::error::Published release ${TAG} is missing git tag refs/tags/${TAG}; refusing to modify."
              exit 1
            fi
            if [ "${#MISSING_ASSETS[@]}" -gt 0 ]; then
              echo "Release ${TAG} exists with verified partial assets; uploading ${#MISSING_ASSETS[@]} missing asset(s)."
              gh release upload "$TAG" "${MISSING_ASSETS[@]}" --repo "$REPO"
            else
              echo "Release ${TAG} already exists with all verified assets."
            fi

            NEWER_TAG="$(find_newer_published_tag)"
            if [ -n "$NEWER_TAG" ]; then
              echo "::warning::Newer release ${NEWER_TAG} is already published; leaving latest release unchanged."
              exit 0
            fi

            CURRENT_LATEST_TAG=""
            if LATEST_JSON="$(gh api "repos/$REPO/releases/latest" 2>/dev/null)"; then
              CURRENT_LATEST_TAG="$(printf '%s' "$LATEST_JSON" | jq -r '.tag_name // empty')"
            fi
            if [ "$CURRENT_LATEST_TAG" != "$TAG" ]; then
              gh release edit "$TAG" --latest --repo "$REPO"
            fi
          elif [ "$RELEASE_STATE" = "draft" ]; then
            echo "Draft release ${TAG} exists for ${TARGET_SHA}; uploading verified assets and promoting."
            gh release upload "$TAG" "${ASSETS[@]}" --clobber --repo "$REPO"

            NEWER_TAG="$(find_newer_published_tag)"
            if [ -n "$NEWER_TAG" ]; then
              echo "::warning::Newer release ${NEWER_TAG} was published before ${TAG} promotion; leaving draft ${TAG} unpublished."
              exit 0
            fi

            gh release edit "$TAG" --draft=false --latest --repo "$REPO"
          else
            NEWER_TAG="$(find_newer_published_tag)"
            if [ -n "$NEWER_TAG" ]; then
              echo "::warning::Skipping stale release ${TAG}: newer release ${NEWER_TAG} is already published."
              exit 0
            fi

            gh release create "$TAG" "${ASSETS[@]}" \
              --repo "$REPO" \
              --target "$TARGET_SHA" \
              --title "Screenshare Desktop ${TAG}" \
              --generate-notes \
              --latest
          fi
