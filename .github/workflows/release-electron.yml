name: Release Electron Desktop App

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (MAJOR.MINOR.PATCH); leave empty to use package.json version"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-electron-production
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate & Plan Electron Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      target_sha: ${{ steps.plan.outputs.target_sha }}
    steps:
      - name: Checkout tagged commit or main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release version, CI/CodeQL gates, and target commit
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          TARGET_SHA="$(git rev-parse HEAD)"

          # Verify the target commit is reachable from origin/main (full history, no shallow boundary)
          # so untrusted/unreviewed side-branch commits or tags cannot trigger a release.
          git fetch origin +refs/heads/main:refs/remotes/origin/main >/dev/null 2>&1 || true
          if ! git merge-base --is-ancestor "$TARGET_SHA" origin/main 2>/dev/null; then
            echo "::error::Target commit ${TARGET_SHA} (${REF_NAME}) is not an ancestor of origin/main."
            exit 1
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            if [[ ! "$REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error::Tag '$REF_NAME' must match vMAJOR.MINOR.PATCH"
              exit 1
            fi
            RELEASE_VERSION="${BASH_REMATCH[1]}"
          else
            TRIMMED_INPUT="$(printf '%s' "${INPUT_VERSION:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if [ -n "$TRIMMED_INPUT" ]; then
              RAW_VERSION="${TRIMMED_INPUT#v}"
            else
              RAW_VERSION="$(node -p "require('./package.json').version")"
            fi
            if [[ ! "$RAW_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error::Release version '$RAW_VERSION' must match MAJOR.MINOR.PATCH"
              exit 1
            fi
            RELEASE_VERSION="${BASH_REMATCH[1]}"
          fi

          # Ensure version does not regress below an existing published tag.
          ALL_TAGS="$({
            git tag -l 'v*'
            gh api --paginate "repos/$REPO/releases?per_page=100" --jq '.[].tag_name' 2>/dev/null || true
          } | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -uV || true)"
          LATEST_TAG=""
          if [ -n "$ALL_TAGS" ]; then
            LATEST_TAG="$(printf '%s\n' "$ALL_TAGS" | tail -n 1)"
          fi
          if [ -n "$LATEST_TAG" ] && [ "$LATEST_TAG" != "v${RELEASE_VERSION}" ]; then
            if ! RELEASE_VERSION="$RELEASE_VERSION" LATEST_TAG="$LATEST_TAG" node -e '
              const parse = (v) => v.replace(/^v/, "").split(".").map((n) => Number.parseInt(n, 10));
              const [na, nb, nc] = parse(process.env.RELEASE_VERSION);
              const [la, lb, lc] = parse(process.env.LATEST_TAG);
              const ge = na > la || (na === la && (nb > lb || (nb === lb && nc >= lc)));
              process.exit(ge ? 0 : 1);
            '; then
              echo "::error::Target version v${RELEASE_VERSION} regresses below latest release ${LATEST_TAG}."
              exit 1
            fi
          fi

          echo "Verifying main-branch CI and CodeQL status for commit ${TARGET_SHA}..."
          for WORKFLOW_FILE in "ci.yml" "codeql.yml"; do
            ATTEMPTS=0
            while true; do
              RUN_JSON="$(gh api "repos/$REPO/actions/workflows/$WORKFLOW_FILE/runs?head_sha=$TARGET_SHA&branch=main&event=push&per_page=10")"
              STATUS="$(printf '%s' "$RUN_JSON" | jq -r '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")][0].status // (.workflow_runs[0].status // "missing")')"
              CONCLUSION="$(printf '%s' "$RUN_JSON" | jq -r '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")][0].conclusion // (.workflow_runs[0].conclusion // "null")')"

              if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" = "success" ]; then
                echo "${WORKFLOW_FILE} succeeded on main for ${TARGET_SHA}."
                break
              fi
              if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" != "cancelled" ] && [ "$CONCLUSION" != "skipped" ]; then
                echo "::error::${WORKFLOW_FILE} completed with conclusion '${CONCLUSION}' for ${TARGET_SHA}."
                exit 1
              fi

              ATTEMPTS=$((ATTEMPTS + 1))
              if [ "$ATTEMPTS" -ge 60 ]; then
                echo "::error::Timed out waiting for ${WORKFLOW_FILE} (push on main) on ${TARGET_SHA} (last status: ${STATUS}, conclusion: ${CONCLUSION})."
                exit 1
              fi
              sleep 10
            done
          done

          echo "Planning Electron release v${RELEASE_VERSION} at commit ${TARGET_SHA}"
          {
            echo "version=${RELEASE_VERSION}"
            echo "target_sha=${TARGET_SHA}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build, Fuse-Verify & Smoke-Test Windows Installer
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout target commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci --legacy-peer-deps

      - name: Stamp release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          npm pkg set "version=${RELEASE_VERSION}"

      - name: Build Windows installer
        shell: bash
        run: npm run electron:build

      - name: Smoke-test unpackaged app, verify burned fuses/ASAR startup, and hash artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          test -f "release/win-unpacked/resources/app-update.yml"
          test -f "release/Screenshare-Setup-${RELEASE_VERSION}.exe"
          test -f "release/Screenshare-Setup-${RELEASE_VERSION}.exe.blockmap"
          test -f "release/latest.yml"
          npm run electron:smoke
          npm run electron:smoke:packaged
          (
            cd release
            sha256sum -b \
              "Screenshare-Setup-${RELEASE_VERSION}.exe" \
              "Screenshare-Setup-${RELEASE_VERSION}.exe.blockmap" \
              "latest.yml" > SHA256SUMS.txt
          )

      - name: Upload Windows release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-assets
          path: |
            release/Screenshare-Setup-${{ needs.prepare.outputs.version }}.exe
            release/Screenshare-Setup-${{ needs.prepare.outputs.version }}.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Attest Provenance & Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download built release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release-assets
          path: dist-release

      - name: Verify checksums before attestation and release
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid RELEASE_VERSION: '$RELEASE_VERSION'"
            exit 1
          fi
          for ASSET in \
            "dist-release/Screenshare-Setup-${RELEASE_VERSION}.exe" \
            "dist-release/Screenshare-Setup-${RELEASE_VERSION}.exe.blockmap" \
            "dist-release/latest.yml" \
            "dist-release/SHA256SUMS.txt"; do
            test -f "$ASSET"
          done
          (
            cd dist-release
            sha256sum -c SHA256SUMS.txt
          )

      - name: Generate SLSA build provenance attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-release/Screenshare-Setup-${{ needs.prepare.outputs.version }}.exe
            dist-release/Screenshare-Setup-${{ needs.prepare.outputs.version }}.exe.blockmap
            dist-release/latest.yml
            dist-release/SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit

          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid TARGET_SHA: '$TARGET_SHA'"
            exit 1
          fi

          TAG="v${RELEASE_VERSION}"
          ASSETS=(
            "dist-release/Screenshare-Setup-${RELEASE_VERSION}.exe"
            "dist-release/Screenshare-Setup-${RELEASE_VERSION}.exe.blockmap"
            "dist-release/latest.yml"
            "dist-release/SHA256SUMS.txt"
          )

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          gh api --paginate "repos/$REPO/releases?per_page=100" > "$TMP_DIR/releases.raw.json"
          jq -s 'add // [] | map({tag_name, draft, prerelease, target_commitish, assets: ((.assets // []) | map({name, state, size, digest}))})' \
            "$TMP_DIR/releases.raw.json" > "$TMP_DIR/releases.json"
          gh api --paginate "repos/$REPO/git/matching-refs/tags/v" > "$TMP_DIR/tags.raw.json"
          jq -s 'add // [] | map(.ref)' "$TMP_DIR/tags.raw.json" > "$TMP_DIR/tags.json"

          TAG_EXISTS="$(jq -r --arg ref "refs/tags/${TAG}" 'any(.[]; . == $ref)' "$TMP_DIR/tags.json")"
          if [ "$TAG_EXISTS" = "true" ]; then
            EXISTING_TAG_SHA="$(gh api "repos/$REPO/commits/refs/tags/$TAG" --jq '.sha')"
            if [ "$EXISTING_TAG_SHA" != "$TARGET_SHA" ]; then
              echo "::error::Tag ${TAG} already points to ${EXISTING_TAG_SHA}, expected ${TARGET_SHA}; refusing to modify release."
              exit 1
            fi
          fi

          # Recheck version floor against published releases/tags before modifying --latest
          PUBLISHED_TAGS="$({
            jq -r '.[] | select(.draft == false) | .tag_name // empty' "$TMP_DIR/releases.json"
            jq -r '.[] | sub("^refs/tags/"; "")' "$TMP_DIR/tags.json"
          } | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -uV || true)"
          LATEST_PUBLISHED=""
          if [ -n "$PUBLISHED_TAGS" ]; then
            LATEST_PUBLISHED="$(printf '%s\n' "$PUBLISHED_TAGS" | tail -n 1)"
          fi
          if [ -n "$LATEST_PUBLISHED" ] && [ "$LATEST_PUBLISHED" != "$TAG" ]; then
            if ! RELEASE_VERSION="$RELEASE_VERSION" LATEST_TAG="$LATEST_PUBLISHED" node -e '
              const parse = (v) => v.replace(/^v/, "").split(".").map((n) => Number.parseInt(n, 10));
              const [na, nb, nc] = parse(process.env.RELEASE_VERSION);
              const [la, lb, lc] = parse(process.env.LATEST_TAG);
              const ge = na > la || (na === la && (nb > lb || (nb === lb && nc >= lc)));
              process.exit(ge ? 0 : 1);
            '; then
              echo "::error::A newer version (${LATEST_PUBLISHED}) was published while building ${TAG}; refusing to move --latest backwards."
              exit 1
            fi
          fi

          EXISTING_COUNT="$(jq -r --arg tag "$TAG" '[.[] | select(.tag_name == $tag)] | length' "$TMP_DIR/releases.json")"
          if [ "$EXISTING_COUNT" -gt 1 ]; then
            echo "::error::Multiple releases found for ${TAG}."
            exit 1
          fi
          if [ "$EXISTING_COUNT" -eq 1 ]; then
            IS_DRAFT="$(jq -r --arg tag "$TAG" '[.[] | select(.tag_name == $tag)][0].draft' "$TMP_DIR/releases.json")"
            EXISTING_COMMITISH="$(jq -r --arg tag "$TAG" '[.[] | select(.tag_name == $tag)][0].target_commitish // ""' "$TMP_DIR/releases.json")"
            if [ "$IS_DRAFT" = "true" ]; then
              if [ -n "$EXISTING_COMMITISH" ] && [ "$EXISTING_COMMITISH" != "$TARGET_SHA" ] && [ "$EXISTING_COMMITISH" != "main" ]; then
                echo "::error::Draft release ${TAG} targets ${EXISTING_COMMITISH}, expected ${TARGET_SHA}; refusing to promote mismatched draft."
                exit 1
              fi
              gh release upload "$TAG" "${ASSETS[@]}" --clobber --repo "$REPO"
              gh release edit "$TAG" --draft=false --prerelease=false --latest --target "$TARGET_SHA" --repo "$REPO"
              exit 0
            fi
            echo "::error::Release ${TAG} already exists; refusing to overwrite published release."
            exit 1
          fi

          gh release create "$TAG" "${ASSETS[@]}" \
            --repo "$REPO" \
            --target "$TARGET_SHA" \
            --title "Screenshare Desktop ${TAG}" \
            --generate-notes \
            --latest
