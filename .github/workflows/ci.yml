name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (Typecheck, Lint, Test, E2E)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck (tsconfig + tsconfig.worker)
        run: npm run check

      - name: Lint & dead-code analysis (knip + oxlint)
        run: npm run lint:all

      - name: Unit tests with coverage thresholds
        run: npx vitest run test/unit --config vitest.config.ts --coverage

      - name: Durable Object workerd tests
        run: npm run test:worker

      - name: Formal invariant & fuzz tests
        run: |
          npm run test:formal
          npm run test:fuzz

      - name: Mutation testing (Stryker)
        run: npm run test:mutate

      - name: Build static assets & run E2E suite
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: npm run test:e2e

      - name: Upload coverage to DeepSource
        if: ${{ env.DEEPSOURCE_DSN != '' }}
        env:
          DEEPSOURCE_DSN: ${{ secrets.DEEPSOURCE_DSN }}
        uses: deepsourcecorp/test-coverage-action@4284bb73a04adb39faaa6bfcc2d0e3dd137ffed7 # v1.1.3
        with:
          key: javascript
          coverage-file: ./coverage/lcov.info
          dsn: ${{ secrets.DEEPSOURCE_DSN }}
