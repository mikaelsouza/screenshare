name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-and-test:
    name: Check, Lint & Test (Unit, Worker, Formal, Fuzz)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability audit (production + Electron/dev)
        run: npm audit --audit-level=moderate

      - name: Typecheck (tsconfig + tsconfig.worker + tsconfig.electron)
        run: npm run check

      - name: Build Electron main and preload
        run: npm run build:electron

      - name: Lint & dead-code analysis (knip + oxlint)
        run: npm run lint:all

      - name: Unit tests with coverage thresholds
        run: npx vitest run test/unit --config vitest.config.ts --coverage

      - name: Durable Object workerd tests
        run: npm run test:worker:coverage

      - name: Exhaustive, stateful model & fuzz invariant tests
        run: |
          npm run test:formal
          npm run test:fuzz

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

  mutation:
    name: Mutation Testing (Stryker)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Mutation testing (Stryker diff-based on changed files)
        env:
          STRYKER_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: npm run test:mutate:ci

  e2e:
    name: E2E Suite (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static assets & run E2E suite
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: npm run test:e2e

  e2e-impaired:
    name: Network-Impaired E2E Suite (tc netem + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static assets & run network-impaired E2E suite
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
          REQUIRE_NETEM: "1"
        run: npm run test:e2e:impaired

  electron-smoke:
    name: Electron Packaged Smoke Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Build Windows NSIS installer and unpacked app
        shell: bash
        run: npm run electron:build

      - name: Verify release metadata and run unpackaged & packaged Electron smoke checks
        shell: bash
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          test -f "release/win-unpacked/resources/app-update.yml"
          test -f "release/Screenshare-Setup-${PKG_VERSION}.exe"
          test -f "release/Screenshare-Setup-${PKG_VERSION}.exe.blockmap"
          test -f "release/latest.yml"
          npm run electron:smoke
          npm run electron:smoke:packaged
