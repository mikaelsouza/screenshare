name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-and-test:
    name: Check, Lint & Test (Unit, Worker, Formal, Fuzz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck (tsconfig + tsconfig.worker + tsconfig.electron)
        run: npm run check

      - name: Build Electron main and preload
        run: npm run build:electron

      - name: Lint & dead-code analysis (knip + oxlint)
        run: npm run lint:all

      - name: Unit tests with coverage thresholds
        run: npx vitest run test/unit --config vitest.config.ts --coverage

      - name: Durable Object workerd tests
        run: npm run test:worker

      - name: Formal invariant & fuzz tests
        run: |
          npm run test:formal
          npm run test:fuzz

  mutation:
    name: Mutation Testing (Stryker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Mutation testing (Stryker)
        run: npm run test:mutate

  e2e:
    name: E2E Suite (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build static assets & run E2E suite
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: npm run test:e2e
