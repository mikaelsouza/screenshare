version: 2
updates:
  # Keeps the SHA-pinned actions across workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Group dev tooling together, but keep Electron separate so Chromium/Electron
    # runtime updates stand out as desktop-release-worthy PRs.
    groups:
      dev-dependencies:
        dependency-type: development
        exclude-patterns:
          - "electron"
