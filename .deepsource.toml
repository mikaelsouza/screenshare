version = 1

test_patterns = [
  "test/**"
]

exclude_patterns = [
  "dist/**",
  "dist-electron/**",
  "release/**",
  "reports/**",
  "coverage/**",
  "node_modules/**",
  ".wrangler/**",
  ".stryker-tmp/**"
]

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  dialect = "typescript"
  module_system = "es-modules"
  environment = ["nodejs", "browser"]

[[analyzers]]
name = "test-coverage"
enabled = true

[[analyzers]]
name = "secrets"
enabled = true
