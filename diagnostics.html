<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%233b82f6'/%3E%3Crect x='3' y='4' width='10' height='6' rx='1' fill='%23fff'/%3E%3Crect x='6' y='11' width='4' height='1' fill='%23fff'/%3E%3C/svg%3E" />
    <title>Screenshare - Connection Diagnostics</title>
    <style>
      :root {
        --bg-color: #121214;
        --surface-color: #1a1a1e;
        --surface-hover: #26262b;
        --border-color: #2e2e36;
        --text-primary: #ededed;
        --text-secondary: #8e8e99;
        --accent-color: #3b82f6;
        --accent-hover: #2563eb;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.75rem 1.5rem;
        background-color: var(--surface-color);
        border-bottom: 1px solid var(--border-color);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .brand h1 {
        font-size: 1.125rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .header-links a {
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 0.875rem;
        padding: 0.35rem 0.65rem;
        border-radius: 4px;
        transition: color 0.15s, background-color 0.15s;
      }
      .header-links a:hover {
        color: var(--text-primary);
        background-color: var(--surface-hover);
      }
      main {
        max-width: 860px;
        width: 100%;
        margin: 2rem auto;
        padding: 0 1.5rem;
        flex: 1;
      }
      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.5rem;
      }
      .actions h2 {
        font-size: 1.25rem;
        font-weight: 600;
      }
      button {
        background-color: var(--accent-color);
        color: #ffffff;
        border: 1px solid var(--accent-color);
        padding: 0.5rem 1.25rem;
        border-radius: 6px;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.15s;
      }
      button:hover {
        background-color: var(--accent-hover);
      }
      .privacy-note {
        font-size: 0.8rem;
        color: var(--text-secondary, #8e8e99);
        margin: 0 0 1rem;
      }
      .table-container {
        border: 1px solid var(--border-color);
        border-radius: 8px;
        overflow: hidden;
        background-color: var(--surface-color);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
        font-size: 0.875rem;
      }
      th {
        background-color: var(--surface-hover);
        color: var(--text-secondary);
        font-weight: 600;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--border-color);
      }
      td {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--border-color);
      }
      tr:last-child td {
        border-bottom: none;
      }
      #results:empty::before {
        content: "Click 'Run test' to perform connectivity diagnostics.";
        display: block;
        padding: 1.5rem;
        color: var(--text-secondary);
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <h1>Screenshare Diagnostics</h1>
      </div>
      <nav class="header-links">
        <a href="/">Back to App</a>
      </nav>
    </header>

    <main>
      <div class="actions">
        <h2>Connection Diagnostics</h2>
        <button type="button" id="run-btn">Run test</button>
      </div>
      <p class="privacy-note">
        The test contacts Cloudflare's and Google's public STUN servers, so both see your IP
        address. The app itself only uses Cloudflare's.
      </p>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Test</th>
              <th>Status</th>
              <th>Details</th>
            </tr>
          </thead>
          <tbody id="results"></tbody>
        </table>
      </div>
    </main>

    <script type="module" src="/src/diagnostics.ts"></script>
  </body>
</html>
