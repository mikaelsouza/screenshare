<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Cdefs%3E%3ClinearGradient id='b' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232DD4BF'/%3E%3Cstop offset='1' stop-color='%230D9488'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M98 48 L78 24 M158 48 L178 24' fill='none' stroke='%230D9488' stroke-width='11' stroke-linecap='round'/%3E%3Ccircle cx='78' cy='24' r='9' fill='%235EEAD4'/%3E%3Ccircle cx='178' cy='24' r='9' fill='%235EEAD4'/%3E%3Crect x='64' y='196' width='36' height='26' rx='12' fill='%23115E59'/%3E%3Crect x='156' y='196' width='36' height='26' rx='12' fill='%23115E59'/%3E%3Crect x='28' y='44' width='200' height='162' rx='40' fill='url(%23b)' stroke='%2399F6E4' stroke-width='4'/%3E%3Crect x='50' y='66' width='156' height='118' rx='26' fill='%2318181B'/%3E%3Ccircle cx='96' cy='116' r='12' fill='%23FDE047'/%3E%3Ccircle cx='160' cy='116' r='12' fill='%23FDE047'/%3E%3Cpath d='M106 140 Q128 158 150 140' fill='none' stroke='%23FDE047' stroke-width='10' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Screenshare</title>
    <style>
      :root {
        --bg-color: #09090b;
        --surface-color: #121215;
        --surface-hover: #1c1c21;
        --border-color: #27272a;
        --text-primary: #f4f4f5;
        --text-secondary: #8e8e99;
        --accent-color: #3b82f6;
        --accent-hover: #2563eb;
        --danger-color: #dc2626;
        --radius: 6px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      [hidden] {
        display: none !important;
      }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-primary);
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Primitive 1: App Bar (strict 52px height for 0px shift across states) */
      .app-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        height: 52px;
        padding: 0 16px;
        background-color: var(--surface-color);
        flex-shrink: 0;
      }
      header.app-bar {
        position: relative;
        border-bottom: 1px solid var(--border-color);
      }
      footer.app-bar {
        border-top: 1px solid var(--border-color);
      }

      /* Primitive 2: Card / Popover */
      .app-card {
        background-color: var(--surface-color);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 16px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
      }

      /* Primitive 3: Controls (.ui-btn / .ui-input) */
      .ui-btn,
      .ui-input {
        height: 32px;
        padding: 0 12px;
        border-radius: var(--radius);
        border: 1px solid var(--border-color);
        background-color: var(--surface-hover);
        color: var(--text-primary);
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        white-space: nowrap;
        flex-shrink: 0;
        font-variant-numeric: tabular-nums;
      }
      .ui-btn {
        cursor: pointer;
        transition: background-color 0.12s, border-color 0.12s, color 0.12s;
      }
      .ui-btn:hover:not(:disabled) {
        background-color: #27272e;
      }
      .ui-btn[aria-expanded="true"] {
        border-color: var(--accent-color);
        background-color: #27272e;
      }
      .ui-btn:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .ui-btn.primary {
        background-color: var(--accent-color);
        border-color: var(--accent-color);
        color: #ffffff;
      }
      .ui-btn.primary:hover:not(:disabled) {
        background-color: var(--accent-hover);
        border-color: var(--accent-hover);
      }
      .ui-btn.danger {
        background-color: rgba(220, 38, 38, 0.16);
        border-color: rgba(220, 38, 38, 0.45);
        color: #fca5a5;
      }
      .ui-btn.danger:hover:not(:disabled) {
        background-color: rgba(220, 38, 38, 0.26);
      }
      .ui-btn.muted-active {
        background-color: rgba(245, 158, 11, 0.16);
        border-color: rgba(245, 158, 11, 0.45);
        color: #fcd34d;
      }
      .ui-btn.muted-active:hover:not(:disabled) {
        background-color: rgba(245, 158, 11, 0.26);
      }
      .ui-input {
        background-color: var(--bg-color);
        cursor: text;
      }
      .ui-input:focus {
        outline: none;
        border-color: var(--accent-color);
      }

      /* Primitive 4: Status Dot */
      .ui-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: var(--text-secondary);
        flex-shrink: 0;
      }
      .ui-dot[data-state="live"] {
        background-color: #22c55e;
      }
      .ui-dot[data-state="warn"] {
        background-color: #f59e0b;
      }
      .ui-dot[data-state="active"] {
        background-color: var(--accent-color);
      }

      /* Header */
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .brand h1 {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 20px;
        white-space: nowrap;
        display: flex;
        align-items: center;
      }
      #brand-home {
        appearance: none;
        background: transparent;
        border: 0;
        padding: 0;
        margin: 0;
        color: inherit;
        font: inherit;
        letter-spacing: inherit;
        line-height: inherit;
        cursor: pointer;
        border-radius: 4px;
        transition: opacity 0.12s;
      }
      #brand-home:hover:not(:disabled) {
        opacity: 0.82;
      }
      #brand-home:disabled {
        cursor: default;
        opacity: 1;
      }
      #follow-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 10px;
        border: 1px solid var(--border-color);
        border-radius: 999px;
        background-color: var(--bg-color);
        font-size: 12px;
        color: var(--text-secondary);
      }
      #status {
        font-size: 12px;
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 480px;
        min-width: 0;
      }
      #status[data-kind="warn"] {
        color: #fbbf24;
      }
      #status[data-kind="error"] {
        color: #f87171;
      }
      #room-bar {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
        flex-shrink: 0;
      }

      /* Shared Popover Anchors & Menus (Invite, Roster, Stream Quality, Video Codec, Stream Priority) */
      .popover-anchor,
      .invite-anchor,
      .roster-anchor {
        position: relative;
        display: inline-flex;
      }
      .invite-split {
        display: inline-flex;
        align-items: stretch;
      }
      .invite-split > .ui-btn:first-child {
        border-top-right-radius: 0;
        border-bottom-right-radius: 0;
      }
      .invite-split > .ui-btn:last-child {
        border-top-left-radius: 0;
        border-bottom-left-radius: 0;
        margin-left: -1px;
        padding: 0 9px;
      }
      .invite-split > .ui-btn:hover:not(:disabled),
      .invite-split > .ui-btn:active:not(:disabled),
      .invite-split > .ui-btn[aria-expanded="true"],
      .invite-split > .ui-btn.invite-feedback-ok {
        position: relative;
        z-index: 1;
      }
      .invite-split > .ui-btn:focus-visible {
        position: relative;
        z-index: 2;
      }
      .invite-copy-label {
        display: inline-grid;
        align-items: center;
        justify-items: center;
      }
      .invite-copy-default,
      .invite-copy-feedback {
        grid-area: 1 / 1;
      }
      .invite-copy-feedback {
        visibility: hidden;
      }
      .invite-check-icon {
        display: none;
      }
      #invite-copy-link.invite-feedback-ok .invite-copy-default {
        visibility: hidden;
      }
      #invite-copy-link.invite-feedback-ok .invite-copy-feedback {
        visibility: visible;
      }
      #invite-copy-link.invite-feedback-ok .invite-copy-icon {
        display: none;
      }
      #invite-copy-link.invite-feedback-ok .invite-check-icon {
        display: inline-block;
      }
      #invite-menu,
      #roster {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        max-width: calc(100vw - 32px);
        z-index: 30;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px;
      }
      #invite-menu {
        width: 368px;
      }
      #roster {
        width: 380px;
      }
      @media (max-width: 680px) {
        #invite-copy-link {
          position: relative;
          width: 32px;
          padding: 0;
          gap: 0;
        }
        .invite-copy-label {
          position: absolute;
          width: 1px;
          height: 1px;
          padding: 0;
          margin: -1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
          border: 0;
        }
        #room-bar,
        .invite-anchor,
        .roster-anchor {
          position: static;
        }
        #invite-menu,
        #roster {
          top: calc(100% + 4px);
          left: 12px;
          right: 12px;
          width: auto;
          max-width: none;
        }
      }
      #invite-rotate-btn {
        height: 26px;
        padding: 0 8px;
        font-size: 12px;
      }
      .invite-locked-note {
        padding: 6px 8px;
        border-radius: var(--radius);
        border: 1px solid rgba(245, 158, 11, 0.35);
        background-color: rgba(245, 158, 11, 0.1);
        color: #fbbf24;
        font-size: 12px;
      }
      .invite-code-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-height: 30px;
        padding: 4px 8px;
        border-radius: var(--radius);
        background-color: var(--bg-color);
        border: 1px solid var(--border-color);
      }
      .invite-code-value {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11.5px;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
        flex: 1;
      }
      .invite-code-row.is-disabled .invite-code-value {
        color: var(--text-secondary);
        opacity: 0.65;
      }
      .invite-code-actions {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }
      .invite-inline-btn {
        height: 22px;
        padding: 0 8px;
        font-size: 11px;
      }
      .popover-item:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .popover-item:disabled:hover {
        background-color: var(--bg-color);
      }
      .invite-feedback-ok {
        color: #4ade80 !important;
        border-color: rgba(34, 197, 94, 0.5) !important;
      }
      #roster-btn.has-unread {
        border-color: rgba(34, 197, 94, 0.55);
        background-color: rgba(34, 197, 94, 0.12);
      }
      .roster-unread-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background-color: #22c55e;
        flex-shrink: 0;
      }
      .popover-up {
        position: absolute;
        bottom: calc(100% + 8px);
        left: 0;
        max-width: calc(100vw - 32px);
        z-index: 30;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px;
      }
      #preset-menu {
        width: 224px;
      }
      #codec-menu {
        width: 268px;
      }
      #degradation-menu {
        width: 268px;
      }
      .popover-head,
      .roster-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
        font-variant-numeric: tabular-nums;
      }
      #roster-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
        font-variant-numeric: tabular-nums;
      }
      #lock-btn {
        height: 26px;
        padding: 0 8px;
        font-size: 12px;
      }
      .popover-list,
      #roster-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-variant-numeric: tabular-nums;
      }
      #roster-list {
        max-height: 280px;
        overflow-y: auto;
      }
      .popover-item,
      #roster-list li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-height: 30px;
        padding: 4px 8px;
        border-radius: var(--radius);
        background-color: var(--bg-color);
        border: 1px solid var(--border-color);
        font: inherit;
        font-size: 12px;
        color: var(--text-primary);
      }
      .popover-item {
        width: 100%;
        text-align: left;
        cursor: pointer;
        transition: background-color 0.12s, border-color 0.12s;
      }
      .popover-item:hover {
        background-color: var(--surface-hover);
      }
      .popover-item[aria-pressed="true"] {
        border-color: var(--accent-color);
        background-color: rgba(59, 130, 246, 0.08);
      }
      .popover-item-left {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 500;
        white-space: nowrap;
      }
      .popover-item-right {
        color: var(--text-secondary);
        font-size: 11px;
        white-space: nowrap;
      }
      .roster-peer {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        overflow: hidden;
      }
      .roster-peer .peer-name {
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .roster-peer .peer-id {
        color: var(--text-secondary);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        flex-shrink: 0;
      }
      .roster-peer .badge,
      .roster-peer .role-badge {
        color: var(--text-secondary);
        font-size: 11px;
        flex-shrink: 0;
      }
      .roster-peer .tag-new {
        padding: 1px 6px;
        border-radius: 999px;
        background-color: rgba(34, 197, 94, 0.14);
        border: 1px solid rgba(34, 197, 94, 0.32);
        color: #4ade80;
        font-size: 10px;
        font-weight: 600;
        flex-shrink: 0;
      }
      .roster-peer .tag-dup {
        padding: 1px 6px;
        border-radius: 999px;
        background-color: rgba(245, 158, 11, 0.14);
        border: 1px solid rgba(245, 158, 11, 0.35);
        color: #fbbf24;
        font-size: 10px;
        font-weight: 600;
        flex-shrink: 0;
      }
      .roster-meta {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }
      .roster-meta .peer-stats {
        color: var(--text-secondary);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .roster-meta .kick-btn {
        height: 22px;
        padding: 0 6px;
        font-size: 11px;
      }
      .roster-self-edit {
        display: flex;
        align-items: center;
        gap: 6px;
        padding-top: 6px;
        border-top: 1px solid var(--border-color);
      }
      .roster-self-edit label {
        font-size: 12px;
        color: var(--text-secondary);
        white-space: nowrap;
      }
      .roster-self-edit input {
        flex: 1;
        min-width: 0;
        height: 28px;
        font-size: 12px;
      }

      /* Lobby View */
      #lobby {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        overflow-y: auto;
      }
      .lobby-card {
        width: 100%;
        max-width: 360px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .lobby-card h2 {
        font-size: 15px;
        font-weight: 600;
      }
      .lobby-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .lobby-field label {
        font-size: 12px;
        color: var(--text-secondary);
      }
      .lobby-field .ui-input {
        width: 100%;
      }
      #room-code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12.5px;
      }
      .ui-input.input-error {
        border-color: #f87171;
      }
      .lobby-error {
        font-size: 12px;
        line-height: 1.4;
        color: #f87171;
      }
      .lobby-join-row {
        display: flex;
        gap: 8px;
      }
      .lobby-join-row .ui-input {
        flex: 1;
        min-width: 0;
      }
      .lobby-divider {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--text-secondary);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .lobby-divider::before,
      .lobby-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background-color: var(--border-color);
      }
      .forget-host-btn {
        color: var(--text-secondary);
        font-size: 12px;
      }
      .forget-host-btn:hover:not(:disabled) {
        color: #fca5a5;
        border-color: rgba(220, 38, 38, 0.45);
      }

      /* Stage & Video Tiles */
      #stage {
        position: relative;
        flex: 1;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(360px, 100%), 1fr));
        grid-auto-rows: minmax(0, 1fr);
        gap: 12px;
        padding: 12px;
        align-content: center;
        justify-items: center;
        align-items: center;
        min-height: 0;
        overflow-y: auto;
      }
      .join-chip {
        position: fixed;
        right: 16px;
        bottom: 68px;
        z-index: 25;
        pointer-events: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        max-width: calc(100% - 32px);
        padding: 6px 12px;
        border-radius: var(--radius);
        background: rgba(9, 9, 11, 0.86);
        border: 1px solid rgba(34, 197, 94, 0.45);
        color: var(--text-primary);
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }
      .join-chip::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background-color: #22c55e;
        flex-shrink: 0;
      }
      .tile:fullscreen .join-chip-mirror {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 40;
      }
      .stage-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        text-align: center;
        color: var(--text-secondary);
        user-select: none;
        padding: 24px;
      }
      .stage-empty svg {
        width: 24px;
        height: 24px;
        stroke: var(--text-secondary);
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
        opacity: 0.65;
        margin-bottom: 2px;
      }
      .stage-empty-title {
        font-size: 13px;
        font-weight: 500;
        color: var(--text-primary);
      }
      .stage-empty-sub {
        font-size: 12px;
        color: var(--text-secondary);
      }
      .tile {
        position: relative;
        width: auto;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        background: #000;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        overflow: hidden;
        aspect-ratio: var(--tile-aspect, 16 / 9);
        touch-action: manipulation;
        justify-self: center;
        align-self: center;
      }
      #stage:not(.has-focused) .tile[data-fit="cover"] {
        width: 100% !important;
        height: 100% !important;
        aspect-ratio: auto !important;
      }
      #stage:not(.has-focused) .tile[data-fit="cover"] video {
        object-fit: cover !important;
      }
      #stage.has-focused {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(214px, 1fr));
        grid-template-rows: 1fr auto;
        gap: 12px;
      }
      #stage.has-focused .tile.tile-focused {
        grid-column: 1 / -1;
        grid-row: 1;
        height: 100%;
        width: auto;
        max-width: 100%;
        max-height: 100%;
        min-height: 0;
        aspect-ratio: var(--tile-aspect, auto);
        justify-self: center;
        align-self: center;
        border-color: var(--accent-color);
      }
      #stage.has-focused .tile.tile-focused video {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #stage.has-focused .tile.tile-focused[data-fit="cover"] {
        width: 100% !important;
        height: 100% !important;
        aspect-ratio: auto !important;
      }
      #stage.has-focused .tile.tile-focused[data-fit="cover"] video {
        object-fit: cover !important;
      }
      #stage.has-focused .tile:not(.tile-focused) {
        height: 120px !important;
        width: auto !important;
        max-width: 100% !important;
        aspect-ratio: var(--tile-aspect, 16 / 9) !important;
        justify-self: center;
        cursor: pointer;
      }
      #stage.has-focused .tile:not(.tile-focused) video {
        object-fit: contain !important;
      }
      #stage.has-focused .tile:not(.tile-focused) .tile-volume,
      #stage.has-focused .tile:not(.tile-focused) .tile-pip,
      #stage.has-focused .tile:not(.tile-focused) .tile-fit {
        display: none;
      }
      .tile:fullscreen {
        width: 100% !important;
        height: 100% !important;
        max-width: none !important;
        max-height: none !important;
        border: 0 !important;
        border-radius: 0 !important;
        aspect-ratio: auto !important;
        background: #000 !important;
      }
      .tile:fullscreen video {
        width: 100% !important;
        height: 100% !important;
        object-fit: contain !important;
      }
      .tile:fullscreen[data-fit="cover"] video {
        object-fit: cover !important;
      }
      .tile video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      .tile-label {
        position: absolute;
        z-index: 3;
        left: 8px;
        bottom: 8px;
        padding: 3px 8px;
        border-radius: 4px;
        background: rgba(9, 9, 11, 0.75);
        font-size: 12px;
        color: var(--text-primary);
      }
      .tile-health {
        position: absolute;
        z-index: 3;
        right: 8px;
        bottom: 8px;
        padding: 3px 8px;
        border-radius: 4px;
        background: rgba(9, 9, 11, 0.75);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        color: var(--text-secondary);
      }
      .tile-unmute {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.35);
        color: var(--text-primary);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        border: 0;
        width: 100%;
        transition: background-color 0.15s;
      }
      .tile-unmute:hover {
        background: rgba(0, 0, 0, 0.48);
      }
      .tile-unmute-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(18, 18, 21, 0.9);
        border: 1px solid var(--border-color);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      }
      .tile-controls {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px 6px;
        border-radius: var(--radius);
        background: rgba(9, 9, 11, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.08);
        opacity: 0;
        transition: opacity 0.15s;
      }
      .tile:hover .tile-controls,
      .tile:focus-within .tile-controls,
      .tile[data-paused="true"] .tile-controls {
        opacity: 1;
      }
      @media (hover: none) {
        .tile-controls {
          opacity: 1;
        }
      }
      .tile-controls button {
        background: transparent;
        border: 0;
        border-radius: 4px;
        width: 26px;
        height: 26px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--text-primary);
        cursor: pointer;
      }
      .tile-controls button.tile-hide-self {
        width: auto;
        padding: 0 8px;
        font-size: 12px;
      }
      .tile-controls button:hover:not(:disabled) {
        background-color: rgba(255, 255, 255, 0.14);
      }
      .tile-controls button[aria-pressed="true"] {
        color: var(--accent-color);
      }
      .tile-controls button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .ui-btn svg,
      .tile-controls svg,
      .tile-unmute svg {
        width: 15px;
        height: 15px;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
        flex-shrink: 0;
      }
      .tile-volume {
        width: 72px;
        accent-color: var(--accent-color);
        cursor: pointer;
      }
      .tile-volume[data-boosted="true"] {
        accent-color: #f59e0b;
      }
      .tile-volume:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .tile-paused {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: none;
        align-items: center;
        justify-content: center;
        width: 100%;
        border: 0;
        border-radius: 0;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        font-size: 14px;
        cursor: pointer;
      }
      .tile[data-paused="true"] .tile-paused {
        display: flex;
      }
      .tile[data-paused="true"] .tile-unmute {
        display: none;
      }

      /* Bottom Stream Controls Bar */
      #live-controls {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .share-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
      }
    </style>
  </head>
  <body>
    <header class="app-bar">
      <div class="brand">
        <h1><button type="button" id="brand-home" title="Return to lobby">Screenshare</button></h1>
        <span id="follow-chip" hidden>
          <span class="ui-dot" id="follow-dot" data-state="live"></span>
          <span id="follow-chip-text"></span>
        </span>
      </div>

      <span id="status" data-kind="info" aria-live="polite" hidden>Not connected</span>

      <div id="room-bar" hidden>
        <div class="invite-anchor popover-anchor">
          <div class="invite-split">
            <button type="button" id="invite-copy-link" class="ui-btn" title="Copy invite link" aria-label="Copy invite link">
              <svg class="invite-copy-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
              </svg>
              <svg class="invite-check-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 6 9 17l-5-5" />
              </svg>
              <span class="invite-copy-label">
                <span class="invite-copy-default">Copy invite link</span>
                <span id="invite-link-feedback" class="invite-copy-feedback" aria-live="polite"></span>
              </span>
            </button>
            <button type="button" id="invite-btn" class="ui-btn" aria-expanded="false" aria-controls="invite-menu" aria-label="Invite options" title="Invite code and options">
              &#9662;
            </button>
          </div>
          <section id="invite-menu" class="app-card" hidden aria-labelledby="invite-menu-title">
            <div class="popover-head">
              <span id="invite-menu-title">Room invite</span>
              <button type="button" id="invite-rotate-btn" class="ui-btn" hidden title="Rotate room invite secret">
                Rotate
              </button>
            </div>
            <p id="invite-locked-note" class="invite-locked-note" hidden>Room is locked — unlock to invite</p>
            <div id="invite-code-row" class="invite-code-row">
              <code id="invite-code-value" class="invite-code-value"></code>
              <div class="invite-code-actions">
                <button type="button" id="invite-show-btn" class="ui-btn invite-inline-btn">Show</button>
                <button type="button" id="invite-copy-code" class="ui-btn invite-inline-btn">Copy</button>
              </div>
            </div>
            <button type="button" id="invite-forget-host" class="popover-item forget-host-btn" hidden title="Remove saved host access for this room from this device">
              <span>Forget host on this device</span>
            </button>
          </section>
        </div>
        <div class="roster-anchor popover-anchor">
          <button type="button" id="roster-btn" class="ui-btn" aria-expanded="false" aria-controls="roster">
            <span id="roster-unread-dot" class="roster-unread-dot" hidden aria-hidden="true"></span>
            <span id="roster-btn-label">1 in room · 0 sharing &#9662;</span>
          </button>
          <section id="roster" class="app-card" hidden aria-labelledby="roster-title">
            <div class="roster-head">
              <h2 id="roster-title">In this room</h2>
              <button type="button" id="lock-btn" class="ui-btn" hidden title="A locked room refuses anyone new. People already in it stay.">
                Lock room
              </button>
            </div>
            <ul id="roster-list"></ul>
            <div class="roster-self-edit">
              <label for="room-name">Your name</label>
              <input type="text" id="room-name" class="ui-input name-input" maxlength="32" placeholder="Your name" spellcheck="false" />
            </div>
          </section>
        </div>
      </div>
    </header>

    <div id="lobby">
      <div id="lobby-card" class="lobby-card app-card">
        <h2>Start or join a room</h2>
        <div class="lobby-field">
          <label for="display-name">Display name</label>
          <input type="text" id="display-name" class="ui-input name-input" placeholder="Your name" maxlength="32" autocomplete="nickname" spellcheck="false" />
        </div>
        <button type="button" id="create" class="ui-btn primary">Create new room</button>
        <div class="lobby-divider">or join with invite</div>
        <div class="lobby-field">
          <label for="room-code">Invite code or link</label>
          <div class="lobby-join-row">
            <input type="text" id="room-code" class="ui-input" placeholder="CODE-SECRET or link" maxlength="256" autocomplete="off" spellcheck="false" />
            <button type="button" id="join" class="ui-btn">Join room</button>
          </div>
          <p id="lobby-error" class="lobby-error" role="alert" hidden></p>
          <p id="lobby-notice" class="lobby-notice" role="status" aria-live="polite" hidden></p>
        </div>
        <div id="recent-rooms-root" class="recent-rooms-root" hidden></div>
      </div>
    </div>

    <main id="stage" hidden>
      <div id="stage-empty" class="stage-empty" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2" y="3" width="20" height="14" rx="2" />
          <line x1="8" y1="21" x2="16" y2="21" />
          <line x1="12" y1="17" x2="12" y2="21" />
        </svg>
        <p id="stage-empty-title" class="stage-empty-title">No one is sharing right now</p>
        <p id="stage-empty-sub" class="stage-empty-sub">
          Click "Share screen" below to start, or wait for someone to share.
        </p>
      </div>
      <div id="join-chip" class="join-chip" role="status" aria-live="polite" hidden></div>
    </main>

    <footer id="controls" class="app-bar" hidden>
      <div id="live-controls" hidden>
        <div class="popover-anchor">
          <button type="button" id="preset-btn" class="ui-btn" aria-expanded="false" aria-controls="preset-menu" title="Video resolution, frame rate, and bitrate">
            <span id="preset-btn-label">1080p 60fps</span> &#9662;
          </button>
          <section id="preset-menu" class="app-card popover-up" hidden aria-labelledby="preset-menu-title">
            <div class="popover-head" id="preset-menu-title">Stream quality</div>
            <div id="preset-list" class="popover-list" role="group" aria-labelledby="preset-menu-title"></div>
          </section>
        </div>
        <div class="popover-anchor">
          <button type="button" id="codec-btn" class="ui-btn" aria-expanded="false" aria-controls="codec-menu" title="Video encoder preference">
            <span id="codec-btn-label">H.264</span> &#9662;
          </button>
          <section id="codec-menu" class="app-card popover-up" hidden aria-labelledby="codec-menu-title">
            <div class="popover-head" id="codec-menu-title">Video codec</div>
            <div id="codec-list" class="popover-list" role="group" aria-labelledby="codec-menu-title"></div>
          </section>
        </div>
        <div class="popover-anchor">
          <button type="button" id="degradation-btn" class="ui-btn" aria-expanded="false" aria-controls="degradation-menu" title="Stream priority under bandwidth bottlenecks">
            <span id="degradation-btn-label">Focus Framerate</span> &#9662;
          </button>
          <section id="degradation-menu" class="app-card popover-up" hidden aria-labelledby="degradation-menu-title">
            <div class="popover-head" id="degradation-menu-title">Stream priority</div>
            <div id="degradation-list" class="popover-list" role="group" aria-labelledby="degradation-menu-title"></div>
          </section>
        </div>
        <button type="button" id="toggle-preview" class="ui-btn" hidden>Show preview</button>
      </div>
      <div class="share-actions">
        <button type="button" id="mute-audio" class="ui-btn" hidden aria-pressed="false" title="Mute or unmute your shared audio"></button>
        <button type="button" id="share" class="ui-btn primary">Share screen</button>
      </div>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
